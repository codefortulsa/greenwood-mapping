[tool.poetry]
name = "greenwood_history_store"
version = "0.1.0"
description = "Data store of events/plots/people in greenwood"
authors = ["Greenwood mapping team"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
Django = "^5.2"
django-configurations = {version = "^2.5", extras = ["cache", "database", "email", "search"]}
rich = "^15"
pydantic = "^2"
django-pydantic-field = "^0.5"
django-polymorphic = "^4"
nameparser = "^1.1"
djangorestframework = "^3.17"
django-extensions = "^4.1"
django-filter = "^25"
adrf = "^0.1.12"
asyncer = "^0.0.17"
petl = {version = "^1.7", extras = ["xlsx"]}
django-pghistory = "^3.9"
django-pgtrigger = "^4.17"
django-rest-polymorphic = "^0.1.10"
psycopg = {version = "^3.3", extras = ["binary"]}
python-dateutil = "^2.9"

[tool.poetry.group.dev.dependencies]
black = "^26"
isort = "^8"
pdbr = "^0.9"
pytest = "^9"
pytest-django = "^4.12"
ipykernel = "^7"
model-bakery = "^1.23"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
exclude = '/(\.eggs|\.git|\.mypy_cache|\.pytest_cache|\.tox|venv|\.venv|build|dist|migrations|htmlcov)/'
include = '\.pyi?$'
line-length = 99
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 99
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
skip_glob = "*/migrations/*"

[tool.pdbr]
store_history = ".pdbr_history"
style = "yellow"
use_traceback = true
theme = "friendly"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "greenwood_history.config"
DJANGO_CONFIGURATION = "Test"
python_files = ["test_*.py", "*_test.py", "testing/python/*.py", "tests.py"]
